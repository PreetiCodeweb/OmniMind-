<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OmniMind</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-void: #080a0f;
    --bg-base: #0d1117;
    --bg-surface: #111620;
    --bg-elevated: #171d2b;
    --bg-hover: #1e2535;
    --bg-active: #232c3d;
    --border-subtle: rgba(255,255,255,0.06);
    --border-mid: rgba(255,255,255,0.10);
    --border-bright: rgba(255,255,255,0.18);
    --text-primary: #f0f4ff;
    --text-secondary: #8b95b0;
    --text-muted: #4a5268;
    --accent-blue: #4d9cff;
    --accent-blue-dim: rgba(77,156,255,0.15);
    --accent-blue-glow: rgba(77,156,255,0.08);
    --accent-cyan: #22d3ee;
    --accent-purple: #a78bfa;
    --accent-green: #34d399;
    --accent-amber: #fbbf24;
    --accent-red: #f87171;
    --font-heading: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
    --sidebar-w: 240px;
    --right-w: 300px;
  }

  html, body, #root { height: 100%; width: 100%; overflow: hidden; }
  body {
    font-family: var(--font-body);
    background: var(--bg-void);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 99px; }

  .app { display: flex; height: 100vh; width: 100vw; overflow: hidden; position: relative; }

  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--bg-base);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 10;
  }
  .sidebar-logo {
    padding: 20px 18px 14px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .logo-mark {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #4d9cff 0%, #a78bfa 100%);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-heading);
    font-weight: 800; font-size: 14px; color: #fff;
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }
  .logo-text { font-family: var(--font-heading); font-weight: 700; font-size: 15px; color: var(--text-primary); letter-spacing: -0.3px; }
  .logo-sub { font-size: 10px; color: var(--text-muted); font-weight: 400; letter-spacing: 0.5px; text-transform: uppercase; }

  .sidebar-section { padding: 10px 10px 4px; }
  .sidebar-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; padding: 4px 8px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: var(--radius-sm);
    cursor: pointer; transition: all 0.15s ease;
    font-size: 13.5px; color: var(--text-secondary);
    font-weight: 400; position: relative;
    user-select: none;
  }
  .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-blue-dim); color: var(--accent-blue); }
  .nav-item.active::before {
    content: ''; position: absolute; left: -10px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 18px; background: var(--accent-blue); border-radius: 0 2px 2px 0;
  }
  .nav-icon { font-size: 16px; width: 18px; text-align: center; flex-shrink: 0; }
  .nav-badge {
    margin-left: auto; background: var(--accent-blue); color: #fff;
    font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 99px;
  }
  .nav-badge.green { background: var(--accent-green); color: #052e1c; }

  .sidebar-models { padding: 0 10px 8px; }
  .model-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: var(--radius-sm);
    cursor: pointer; transition: all 0.15s ease;
    font-size: 12.5px; color: var(--text-secondary);
    border: 1px solid transparent;
  }
  .model-chip:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-subtle); }
  .model-chip.connected { color: var(--text-primary); }
  .model-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .sidebar-footer {
    margin-top: auto;
    border-top: 1px solid var(--border-subtle);
    padding: 12px 10px;
  }
  .user-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: var(--radius-sm);
    cursor: pointer; transition: background 0.15s;
  }
  .user-row:hover { background: var(--bg-hover); }
  .user-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #4d9cff, #a78bfa);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-heading); font-weight: 700; font-size: 12px; color: #fff;
    flex-shrink: 0;
  }
  .user-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
  .user-plan { font-size: 11px; color: var(--text-muted); }

  /* ── MAIN AREA ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-void); }

  .topbar {
    height: 52px; min-height: 52px;
    display: flex; align-items: center;
    padding: 0 20px; gap: 12px;
    border-bottom: 1px solid var(--border-subtle);
    background: var(--bg-base);
  }
  .topbar-title { font-family: var(--font-heading); font-weight: 600; font-size: 15px; color: var(--text-primary); }
  .topbar-sep { width: 1px; height: 18px; background: var(--border-mid); }
  .model-selector {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg-elevated); border: 1px solid var(--border-mid);
    border-radius: var(--radius-sm); padding: 5px 10px;
    font-size: 12.5px; color: var(--text-secondary); cursor: pointer;
    transition: all 0.15s;
  }
  .model-selector:hover { border-color: var(--border-bright); color: var(--text-primary); }
  .model-selector-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-green); }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s;
    color: var(--text-secondary); background: transparent; border: none;
    font-size: 15px;
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

  /* ── CONTENT ── */
  .content { flex: 1; overflow-y: auto; padding: 24px 28px; }

  /* ── DASHBOARD ── */
  .greeting { margin-bottom: 24px; }
  .greeting h1 { font-family: var(--font-heading); font-weight: 700; font-size: 26px; color: var(--text-primary); letter-spacing: -0.5px; line-height: 1.2; }
  .greeting p { font-size: 13.5px; color: var(--text-secondary); margin-top: 4px; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    transition: border-color 0.2s;
  }
  .stat-card:hover { border-color: var(--border-mid); }
  .stat-label { font-size: 11.5px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .stat-value { font-family: var(--font-heading); font-size: 28px; font-weight: 700; color: var(--text-primary); letter-spacing: -1px; line-height: 1; }
  .stat-sub { font-size: 11.5px; color: var(--text-secondary); margin-top: 4px; }
  .stat-accent-blue .stat-value { color: var(--accent-blue); }
  .stat-accent-purple .stat-value { color: var(--accent-purple); }
  .stat-accent-green .stat-value { color: var(--accent-green); }
  .stat-accent-amber .stat-value { color: var(--accent-amber); }

  .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .section-grid.three { grid-template-columns: 2fr 1fr; }
  .panel {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
  }
  .panel-title { font-family: var(--font-heading); font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .panel-title span { font-size: 11px; color: var(--text-muted); font-family: var(--font-body); font-weight: 400; }

  /* model router grid */
  .router-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .router-item {
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 12px 12px 10px;
    cursor: pointer; transition: all 0.2s;
  }
  .router-item:hover { border-color: var(--border-mid); transform: translateY(-1px); }
  .router-item.active { border-color: var(--accent-blue); background: var(--accent-blue-dim); }
  .router-task { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .router-model { font-size: 13px; font-weight: 500; color: var(--text-primary); }
  .router-badge {
    display: inline-block; margin-top: 6px;
    font-size: 10px; padding: 2px 7px; border-radius: 99px;
    font-weight: 500;
  }
  .badge-blue { background: var(--accent-blue-dim); color: var(--accent-blue); }
  .badge-purple { background: rgba(167,139,250,0.12); color: var(--accent-purple); }
  .badge-green { background: rgba(52,211,153,0.12); color: var(--accent-green); }
  .badge-amber { background: rgba(251,191,36,0.12); color: var(--accent-amber); }
  .badge-cyan { background: rgba(34,211,238,0.12); color: var(--accent-cyan); }

  /* knowledge graph mini */
  .kg-nodes { display: flex; flex-direction: column; gap: 8px; }
  .kg-node { display: flex; align-items: center; gap: 10px; }
  .kg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .kg-label { font-size: 13px; color: var(--text-secondary); flex: 1; }
  .kg-bar { height: 4px; background: var(--bg-elevated); border-radius: 99px; flex: 1; overflow: hidden; }
  .kg-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; }

  /* memory vault */
  .memory-list { display: flex; flex-direction: column; gap: 8px; }
  .memory-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    cursor: pointer; transition: border-color 0.15s;
  }
  .memory-item:hover { border-color: var(--border-mid); }
  .memory-icon { font-size: 14px; color: var(--text-muted); margin-top: 1px; }
  .memory-title { font-size: 12.5px; font-weight: 500; color: var(--text-primary); margin-bottom: 2px; }
  .memory-meta { font-size: 11px; color: var(--text-muted); }
  .memory-tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 99px; margin-left: 6px; }

  /* activity */
  .activity-list { display: flex; flex-direction: column; gap: 0; }
  .activity-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle); }
  .activity-item:last-child { border-bottom: none; }
  .activity-avatar { width: 28px; height: 28px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
  .activity-body { flex: 1; min-width: 0; }
  .activity-text { font-size: 12.5px; color: var(--text-secondary); line-height: 1.4; }
  .activity-text strong { color: var(--text-primary); font-weight: 500; }
  .activity-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* ai passport */
  .passport-card {
    background: linear-gradient(135deg, var(--bg-elevated) 0%, rgba(77,156,255,0.05) 100%);
    border: 1px solid rgba(77,156,255,0.2);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    margin-bottom: 16px;
    position: relative; overflow: hidden;
  }
  .passport-bg {
    position: absolute; top: -20px; right: -20px;
    width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, rgba(77,156,255,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .passport-name { font-family: var(--font-heading); font-size: 20px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
  .passport-role { font-size: 12.5px; color: var(--accent-blue); font-weight: 500; margin-bottom: 14px; }
  .passport-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .ptag {
    font-size: 11px; padding: 3px 10px; border-radius: 99px;
    background: var(--bg-surface); border: 1px solid var(--border-mid);
    color: var(--text-secondary); font-weight: 400;
  }
  .passport-stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .passport-stat { text-align: center; }
  .passport-stat-n { font-family: var(--font-heading); font-size: 20px; font-weight: 700; color: var(--text-primary); }
  .passport-stat-l { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

  /* chat view */
  .chat-wrap { display: flex; flex-direction: column; height: 100%; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; }
  .msg { display: flex; gap: 12px; max-width: 680px; }
  .msg.user { flex-direction: row-reverse; align-self: flex-end; }
  .msg-avatar { width: 30px; height: 30px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; margin-top: 2px; }
  .msg-bubble {
    padding: 11px 15px; border-radius: var(--radius-md); font-size: 13.5px; line-height: 1.6;
    color: var(--text-primary); max-width: 520px;
  }
  .msg.ai .msg-bubble { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md); }
  .msg.user .msg-bubble { background: var(--accent-blue-dim); border: 1px solid rgba(77,156,255,0.25); border-radius: var(--radius-md) 4px var(--radius-md) var(--radius-md); }
  .msg-model { font-size: 10.5px; color: var(--text-muted); margin-top: 5px; display: flex; align-items: center; gap: 4px; }
  .model-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; padding: 2px 7px; border-radius: 99px; }

  .chat-input-area {
    padding: 14px 20px 18px;
    border-top: 1px solid var(--border-subtle);
    background: var(--bg-base);
  }
  .chat-input-wrap {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-mid);
    border-radius: var(--radius-lg);
    padding: 10px 12px 10px 16px;
    transition: border-color 0.2s;
  }
  .chat-input-wrap:focus-within { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(77,156,255,0.08); }
  .chat-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text-primary); font-family: var(--font-body); font-size: 13.5px;
    resize: none; min-height: 20px; max-height: 100px; line-height: 1.5;
  }
  .chat-input::placeholder { color: var(--text-muted); }
  .send-btn {
    width: 32px; height: 32px; border-radius: var(--radius-sm); border: none; cursor: pointer;
    background: var(--accent-blue); color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all 0.15s; flex-shrink: 0;
  }
  .send-btn:hover { background: #66aaff; transform: translateY(-1px); }
  .send-btn:disabled { background: var(--bg-hover); color: var(--text-muted); cursor: not-allowed; transform: none; }
  .input-row-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .input-chip {
    display: flex; align-items: center; gap: 5px;
    background: var(--bg-surface); border: 1px solid var(--border-mid);
    border-radius: 99px; padding: 4px 10px;
    font-size: 11.5px; color: var(--text-secondary); cursor: pointer;
    transition: all 0.15s;
  }
  .input-chip:hover { border-color: var(--border-bright); color: var(--text-primary); }
  .input-chip.active { border-color: var(--accent-blue); color: var(--accent-blue); background: var(--accent-blue-dim); }
  .chip-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* memory vault page */
  .vault-filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn {
    padding: 5px 14px; border-radius: 99px; border: 1px solid var(--border-mid);
    background: transparent; color: var(--text-secondary); font-size: 12.5px;
    cursor: pointer; transition: all 0.15s; font-family: var(--font-body);
  }
  .filter-btn:hover { border-color: var(--border-bright); color: var(--text-primary); }
  .filter-btn.active { border-color: var(--accent-blue); color: var(--accent-blue); background: var(--accent-blue-dim); }

  .vault-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .vault-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    cursor: pointer; transition: all 0.2s;
    position: relative; overflow: hidden;
  }
  .vault-card:hover { border-color: var(--border-mid); transform: translateY(-2px); }
  .vault-card-type { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .vault-card-title { font-size: 13.5px; font-weight: 500; color: var(--text-primary); margin-bottom: 6px; line-height: 1.3; }
  .vault-card-body { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 10px; }
  .vault-card-footer { display: flex; align-items: center; justify-content: space-between; }
  .vault-card-date { font-size: 11px; color: var(--text-muted); }
  .vault-card-accent { position: absolute; top: 0; left: 0; right: 0; height: 2px; }

  /* knowledge graph page */
  .kg-page-grid { display: grid; grid-template-columns: 1fr 280px; gap: 16px; }
  .kg-canvas { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; }
  .kg-svg { width: 100%; height: 380px; }

  /* right panel */
  .right-panel { display: flex; flex-direction: column; gap: 12px; }
  .rp-section { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 14px 16px; }
  .rp-title { font-family: var(--font-heading); font-size: 12px; font-weight: 600; color: var(--text-primary); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 12px; }
  .rp-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border-subtle); font-size: 12.5px; color: var(--text-secondary); }
  .rp-item:last-child { border-bottom: none; }
  .rp-item-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .rp-item-val { margin-left: auto; font-size: 11px; color: var(--text-muted); }

  /* tab nav within views */
  .view-tabs { display: flex; gap: 4px; padding: 0 0 16px; }
  .vtab {
    padding: 6px 14px; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer;
    color: var(--text-secondary); transition: all 0.15s; border: none; background: transparent;
    font-family: var(--font-body);
  }
  .vtab:hover { color: var(--text-primary); background: var(--bg-hover); }
  .vtab.active { color: var(--accent-blue); background: var(--accent-blue-dim); font-weight: 500; }

  /* onboarding / empty states */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 40px; }
  .empty-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.4; }
  .empty-title { font-family: var(--font-heading); font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
  .empty-body { font-size: 13.5px; color: var(--text-secondary); max-width: 300px; line-height: 1.6; }

  /* action button */
  .action-btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 16px; border-radius: var(--radius-md); border: none;
    font-family: var(--font-body); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s;
  }
  .action-btn.primary { background: var(--accent-blue); color: #fff; }

function ChatView() {
  const [messages, setMessages] = useState(CHAT_HISTORY);
  const [input, setInput] = useState('');
  const [activeModel, setActiveModel] = useState('claude');
  const [typing, setTyping] = useState(false);
  const [memoryCapture, setMemoryCapture] = useState(false);
  const messagesEnd = useRef(null);
  const [toast, setToast] = useState(null);

  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(null),3000); };

  const send = () => {
    if(!input.trim()) return;
    const userMsg = { id: Date.now(), role:'user', text:input, time: new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) };
    setMessages(prev=>[...prev, userMsg]);
    setInput('');
    setTyping(true);
    setTimeout(()=>{
      setTyping(false);
      setMessages(prev=>[...prev, {
        id:Date.now()+1, role:'ai', model: activeModel==='claude'?'Claude':activeModel==='gemini'?'Gemini':'GPT-4o',
        modelColor: activeModel==='claude'?'#34d399':activeModel==='gemini'?'#4d9cff':'#a78bfa',
        text:'I have your full project context loaded from your AI Passport and Memory Vault. Based on your previous sessions, here\'s my response — continuing from where we left off without you needing to explain anything again.',
        time: new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})
      }]);
      if(memoryCapture) showToast('✦ 1 new memory captured from this exchange');
    }, 1800);
  };

  useEffect(()=>{ messagesEnd.current?.scrollIntoView({behavior:'smooth'}); }, [messages, typing]);

  return (
    <div className="chat-wrap">
      <div style={{padding:'12px 20px', borderBottom:'1px solid var(--border-subtle)', display:'flex', alignItems:'center', gap:'8px', background:'var(--bg-base)'}}>

            <div className="chip-dot" style={{background:m.dot}}></div>
            {m.name}
          </div>
        ))}
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:'8px'}}>
          <span style={{fontSize:'12px',color:'var(--text-muted)'}}>Memory capture</span>
          <label className="toggle"><input type="checkbox" checked={memoryCapture} onChange={e=>setMemoryCapture(e.target.checked)}/><span className="toggle-slider"></span></label>
        </div>
      </div>

      <div className="chat-messages">
        {messages.map(msg=>(
          <div key={msg.id} className={`msg ${msg.role}`}>
            {msg.role==='ai' && (
              <div className="msg-avatar" style={{background:`${msg.modelColor}20`,color:msg.modelColor,fontFamily:'var(--font-heading)',fontWeight:700,fontSize:'10px'}}>
                {msg.model?.[0]}
              </div>
            )}
            <div>
              <div className="msg-bubble" style={{whiteSpace:'pre-wrap'}}>{msg.text}</div>
              {msg.role==='ai' && (
                <div className="msg-model">
                  <span className={`model-pill`} style={{background:`${msg.modelColor}20`,color:msg.modelColor}}>{msg.model}</span>
                  <span>{msg.time}</span>
                  <span style={{marginLeft:'4px',fontSize:'10px',color:'var(--text-muted)'}}>· Memory synced ✓</span>
                </div>
              )}
              {msg.role==='user' && <div className="msg-model" style={{justifyContent:'flex-end'}}>{msg.time}</div>}
            </div>
            {msg.role==='user' && (
              <div className="msg-avatar" style={{background:'rgba(77,156,255,0.2)',color:'var(--accent-blue)',fontFamily:'var(--font-heading)',fontWeight:700,fontSize:'11px'}}>P</div>
            )}
          </div>
        ))}
        {typing && (
          <div className="msg ai">
            <div className="msg-avatar" style={{background:'rgba(52,211,153,0.2)',color:'#34d399',fontFamily:'var(--font-heading)',fontWeight:700,fontSize:'10px'}}>C</div>
            <div className="msg-bubble" style={{minWidth:'60px'}}>
              <span className="typing-dot"></span>
              <span className="typing-dot"></span>
              <span className="typing-dot"></span>
            </div>
          </div>
        )}
        <div ref={messagesEnd} />
      </div>

      <div className="chat-input-area">
        <div className="chat-input-wrap">
          <textarea
            className="chat-input"
            placeholder="Message your AI — with full memory context..."
            value={input}
            onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } }}
            rows={1}
          />
          <button className="send-btn" onClick={send} disabled={!input.trim()}>➤</button>
        </div>
        <div style={{display:'flex',gap:'6px',marginTop:'8px',flexWrap:'wrap'}}>
          {['Continue last session','Summarize project','Draft code skeleton','What have I learned?'].map(s=>(

          ))}
        </div>
      </div>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

function App() {
  const [active, setActive] = useState('dashboard');
  const titles = { dashboard:'Dashboard', chat:'Chat', passport:'AI Passport', vault:'Memory Vault', graph:'Knowledge Graph', router:'AI Router', settings:'Settings' };

  const renderView = () => {
    switch(active) {
      case 'dashboard': return <Dashboard setActive={setActive}/>;
      case 'chat': return <ChatView/>;
      case 'passport': return <PassportView/>;
      case 'vault': return <VaultView/>;
      case 'graph': return <GraphView/>;
      case 'router': return <RouterView/>;
      case 'settings': return <SettingsView/>;
      default: return <Dashboard setActive={setActive}/>;
    }
  };

  return (
    <div className="app">
      <Sidebar active={active} setActive={setActive}/>
      <div className="main">
        <div className="topbar">
          <span className="topbar-title">{titles[active]}</span>
          <div className="topbar-sep"></div>
          <div className="model-selector">
            <div className="model-selector-dot"></div>
            Auto-routing active
            <span style={{fontSize:'10px',color:'var(--text-muted)',marginLeft:'2px'}}>▾</span>
          </div>
          <div className="topbar-actions">
            <button className="icon-btn" title="Search">⊙</button>
            <button className="icon-btn" title="Notifications">◉</button>
            <button className="icon-btn" title="Memory Sync" onClick={()=>{}}>◈</button>
          </div>
        </div>
        {active!=='chat' ? renderView() : <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>{renderView()}</div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
